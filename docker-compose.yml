services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drones
      POSTGRES_PASSWORD: drones
      POSTGRES_DB: drones
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drones"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://drones:drones@db:5432/drones
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
